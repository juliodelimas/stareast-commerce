name: API Tests

on:
  pull_request:
    branches:
      - main

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Start API in background
        run: npm start &

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/healthcheck > /dev/null; then
              echo "API is up and healthy."
              exit 0
            fi
            echo "Waiting for API to be ready..."
            sleep 2
          done
          echo "API did not become healthy in time."
          exit 1

      - name: Run API tests
        run: npm test
